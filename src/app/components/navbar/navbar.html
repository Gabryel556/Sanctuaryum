<nav class="glass-nav">
    <div class="brand-logo" style="font-size: 1.5rem;">SANCTUARYUM</div>
    
    <div class="nav-links">
        <button class="nav-btn-create" (click)="openModal()">
            <i class="fa-solid fa-plus"></i> <span class="nav-text">Criar</span>
        </button>
        
        <a routerLink="/explore" routerLinkActive="active" class="nav-item">
            <i class="fa-solid fa-compass"></i> <span class="nav-text">Explorar</span>
        </a>
        <a routerLink="/chat" routerLinkActive="active" class="nav-item">
            <i class="fa-solid fa-message"></i> <span class="nav-text">Chat</span>
        </a>
        <a routerLink="/waves" routerLinkActive="active" class="nav-item">
            <i class="fa-solid fa-music"></i> <span class="nav-text">Waves</span>
        </a>
        <a routerLink="/profile" routerLinkActive="active" class="nav-item">
            <i class="fa-solid fa-user"></i> <span class="nav-text">Perfil</span>
        </a>
        <a routerLink="/settings" routerLinkActive="active" class="nav-item">
            <i class="fa-solid fa-gear"></i> <span class="nav-text">Config</span>
        </a>
    </div>
</nav>

<div class="modal-overlay" *ngIf="isModalOpen" (click)="closeModal()">
    <div class="modal-box" (click)="$event.stopPropagation()">
        <button class="modal-close" (click)="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        
        <div class="modal-header">
            <h2>Criar Novo</h2>
            <div class="modal-tabs">
                <button class="m-tab" [class.active]="activeTab === 'post'" (click)="switchTab('post')">Post Social</button>
                <button class="m-tab" [class.active]="activeTab === 'server'" (click)="switchTab('server')">Servidor</button>
            </div>
        </div>
        
        <div class="modal-content">
            <div class="upload-area">
                <i class="fa-solid fa-cloud-arrow-up"></i><br>
                <span *ngIf="activeTab === 'post'">Arraste sua foto ou clique para upload</span>
                <span *ngIf="activeTab === 'server'">Escolha o ícone do servidor</span>
            </div>
            
            <input *ngIf="activeTab === 'server'" type="text" placeholder="Nome do Servidor" class="modal-input">
            
            <button class="btn-primary" style="width: 100%; margin-top: 20px;">
                {{ activeTab === 'post' ? 'Publicar' : 'Criar Servidor' }}
            </button>
        </div>
    </div>
</div>
