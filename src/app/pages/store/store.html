<div class="max-w-[1000px] mx-auto p-8 pt-12 min-h-screen text-white">
  
  <div class="flex items-center justify-between mb-12">
    <div>
      <h1 class="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-neon-purple to-neon-blue mb-2">Loja de Cosméticos</h1>
      <p class="text-white/40 text-sm">Adquira bordas e animações para destacar seu perfil pelo Sanctuaryum.</p>
    </div>

    <div *ngIf="storeData" class="flex items-center gap-4 bg-[#14141c]/80 border border-white/5 px-6 py-3 rounded-2xl backdrop-blur-md">
      <div class="text-right">
        <div class="text-xs text-white/40 uppercase tracking-widest font-bold">Seu Saldo</div>
        <div class="text-xl font-bold text-neon-purple flex items-center gap-2">
          {{ storeData.balance }} <i class="fa-solid fa-coins text-sm text-yellow-400"></i>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading" class="text-center py-20">
    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-neon-purple mb-4"></i>
    <p class="text-white/40">Carregando inventário...</p>
  </div>

  <div *ngIf="!isLoading && storeData" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    
    <!-- Item Card -->
    <div *ngFor="let item of storeData.items" class="bg-[#14141c]/60 border border-white/5 rounded-3xl p-6 backdrop-blur-md flex flex-col relative overflow-hidden group hover:border-white/20 transition-all">
      
      <!-- Efeito visual demonstrativo do item -->
      <div class="h-32 mb-6 rounded-2xl bg-black/40 flex items-center justify-center border border-white/5">
        <div class="w-16 h-16 rounded-full bg-[#14141c] flex items-center justify-center text-xl font-bold"
             [ngClass]="item.css_class">
          S
        </div>
      </div>

      <h3 class="text-xl font-bold mb-2">{{ item.name }}</h3>
      <p class="text-sm text-white/50 mb-6 flex-1">{{ item.description }}</p>

      <div class="flex items-center justify-between mt-auto">
        <div class="text-lg font-bold text-yellow-400">
          {{ item.price }} <i class="fa-solid fa-coins text-sm"></i>
        </div>

        <!-- Buttons Logic -->
        <ng-container *ngIf="!hasItem(item.id)">
          <button 
            (click)="buy(item)"
            [disabled]="storeData.balance < item.price"
            class="px-5 py-2 rounded-full font-bold text-sm transition-all"
            [ngClass]="storeData.balance >= item.price ? 'bg-gradient-to-r from-neon-purple to-neon-blue text-white hover:shadow-[0_0_15px_rgba(139,92,246,0.4)]' : 'bg-white/5 text-white/30 cursor-not-allowed'">
            Comprar
          </button>
        </ng-container>

        <ng-container *ngIf="hasItem(item.id)">
          <button 
            *ngIf="!isEquipped(item.id)"
            (click)="equip(item)"
            class="px-5 py-2 rounded-full font-bold text-sm bg-white/10 hover:bg-white/20 text-white transition-all border border-white/10 hover:border-white/30">
            Equipar
          </button>
          <button 
            *ngIf="isEquipped(item.id)"
            (click)="unequip()"
            class="px-5 py-2 rounded-full font-bold text-sm bg-neon-purple/20 text-neon-purple border border-neon-purple/50 shadow-[0_0_10px_rgba(139,92,246,0.2)]">
            Equipado
          </button>
        </ng-container>
      </div>

    </div>

  </div>

</div>
