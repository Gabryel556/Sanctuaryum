<div class="compass-container">
    <header class="compass-header">
        
        <div class="header-hero">
            
            <div class="mode-switch-container" [ngClass]="'mode-' + currentMode">
                <button class="mode-btn" [class.active]="currentMode === 'social'" (click)="setMode('social')">
                    <i class="fa-solid fa-heart"></i> Social
                </button>
                <button class="mode-btn" [class.active]="currentMode === 'community'" (click)="setMode('community')">
                    <i class="fa-solid fa-gamepad"></i> Comunidade
                </button>
                <div class="switch-bg"></div>
            </div>

            <h1 id="hero-title">{{ hero.prefix }}<span class="gradient-text">{{ hero.gradient }}</span></h1>
            <p id="hero-subtitle">{{ hero.subtitle }}</p>
            
            <div class="search-bar-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" 
                       [(ngModel)]="searchTerm" 
                       (input)="onSearch()" 
                       placeholder="Buscar no Sanctuaryum...">
            </div>

            <div class="filter-tags">
                <button *ngFor="let tag of tags" 
                        class="filter-tag" 
                        [class.active]="activeTag === tag"
                        (click)="filterByTag(tag)">
                    {{ tag }}
                </button>
            </div>
        </div>
    </header>

    <main class="compass-main">
        <section class="server-section">
            <h2 class="section-title">{{ hero.feedTitle }}</h2>
            
            <div class="server-grid">
                <div *ngFor="let item of displayData" 
                     class="card" 
                     [ngClass]="currentMode === 'social' ? 'card-social' : 'card-gamer'">
                    
                    <ng-container *ngIf="currentMode === 'social'">
                        <div class="banner" [style.background]="item.gradient || 'linear-gradient(135deg, #1e1b4b, #312e81)'"></div>
                        <div class="content">
                            <div class="title">{{ item.title }}</div>
                            <div class="meta">
                                <i class="fa-regular fa-heart"></i> {{ item.likes }} • {{ item.author.username }}
                            </div>
                        </div>
                    </ng-container>

                    <ng-container *ngIf="currentMode === 'community'">
                        <div class="banner" [style.background]="item.is_promoted ? 'linear-gradient(135deg, #78350f, #f59e0b)' : 'linear-gradient(135deg, #1a1a2e, #16213e)'"></div>
                        <div class="content">
                            <div class="icon relative overflow-hidden flex items-center justify-center text-sm font-bold text-white" 
                                 [style.background]="item.is_promoted ? '#f59e0b' : '#6366f1'">
                                <img *ngIf="item.icon_url" [src]="item.icon_url" class="absolute inset-0 w-full h-full object-cover" />
                                <span *ngIf="!item.icon_url">{{ item.name.charAt(0).toUpperCase() }}</span>
                            </div>
                            <div class="title flex items-center gap-1.5 flex-wrap">
                                <span *ngIf="item.is_promoted" class="bg-yellow-400/20 text-yellow-300 border border-yellow-400/30 text-[9px] font-extrabold uppercase px-1.5 py-0.5 rounded tracking-wide animate-pulse">Promovido</span>
                                {{ item.name }}
                            </div>
                            <div class="meta text-xs text-white/40"><i class="fa-solid fa-users text-neon-blue mr-1"></i>{{ item.members_count || 0 }} habitantes</div>
                            <div class="tags-row">
                                <span *ngFor="let t of item.tags" class="card-tag" [class.promoted-tag]="item.is_promoted">#{{ t }}</span>
                            </div>
                        </div>
                    </ng-container>

                </div>

                <div *ngIf="displayData.length === 0" style="color: #666; padding: 20px;">
                    Nenhum resultado encontrado.
                </div>
            </div>
        </section>
    </main>
</div>
